name: Measure fixed style debt reduction

on:
  push:
    branches:
      - oxalpha/euas-fixed-inline-style-refactor

permissions:
  contents: write

jobs:
  measure:
    if: contains(github.event.head_commit.message, 'trigger fixed style debt measurement')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: oxalpha/euas-fixed-inline-style-refactor
          fetch-depth: 0

      - name: Pin reduced inline-style baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('static/app.js')
          test_path = Path('tests/test_inline_style_debt.py')
          app = app_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          style_attribute = re.compile(r'\bstyle\s*=\s*["\']([^"\']*)["\']', re.IGNORECASE)
          remaining = style_attribute.findall(app)
          baseline = len(remaining)
          if baseline >= 26:
              raise SystemExit(f'fixed-style refactor did not reduce debt: {baseline}')

          test = test.replace(
              "INDEX = STATIC / 'index.html'\n",
              "INDEX = STATIC / 'index.html'\nSTYLES_CSS = STATIC / 'styles.css'\n",
              1,
          )
          test, count = re.subn(
              r"ALLOWED_STATIC_STYLES = \{.*?\}\n",
              "ALLOWED_STATIC_STYLES: set[str] = set()\n",
              test,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('unable to replace transitional static-style allowlist')

          needle = "    assert not STYLE_ATTRIBUTE.findall(INDEX.read_text(encoding='utf-8'))\n\n"
          checks = '''    app_source = APP_JS.read_text(encoding='utf-8')\n    styles_css = STYLES_CSS.read_text(encoding='utf-8')\n    fixed_style_hooks = {\n        'mt14': 'margin-top:14px',\n        'mt12': 'margin-top:12px',\n        'mt15': 'margin-top:15px',\n        'grid2': 'grid-template-columns:1fr 1fr',\n        'inline-check': 'display:flex;gap:8px;align-items:center;font-size:11px;margin-top:10px',\n    }\n    for hook, declaration in fixed_style_hooks.items():\n        assert f'data-csp-style="{hook}"' in app_source\n        assert f'[data-csp-style="{hook}"]{{{declaration}}}' in styles_css\n\n'''
          if needle not in test:
              raise SystemExit('inline-style test insertion point not found')
          test = test.replace(needle, needle + checks, 1)

          test, count = re.subn(
              r"    # The measured baseline is 26 source attributes\. Keep that exact non-growth\n"
              r"    # ceiling while allowing future refactors to reduce the count toward zero\.\n"
              r"    assert total <= 26, f'inline style debt grew to \{total\} app\.js attributes'",
              f"    # The measured post-refactor baseline is {baseline} dynamic source attributes. Keep\n"
              f"    # that exact non-growth ceiling while future refactors reduce it toward zero.\n"
              f"    assert total <= {baseline}, f'inline style debt grew to {{total}} app.js attributes'",
              test,
              count=1,
          )
          if count != 1:
              raise SystemExit('unable to pin reduced inline-style baseline')

          test_path.write_text(test, encoding='utf-8')
          print('remaining inline-style baseline:', baseline)
          print('remaining values:', sorted(set(remaining)))
          PY
          node --check static/app.js
          python -m py_compile tests/test_inline_style_debt.py

      - name: Commit reduced debt contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_inline_style_debt.py
          git commit -m 'test(csp): pin reduced inline-style baseline'
          git push origin HEAD:oxalpha/euas-fixed-inline-style-refactor
