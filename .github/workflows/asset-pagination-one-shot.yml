name: EUAS Asset Pagination One Shot

on:
  push:
    branches:
      - oxalpha/euas-asset-pagination

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oxalpha/euas-asset-pagination
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply deterministic asset pagination patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/asset_store.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'from fastapi import Depends, HTTPException',
                  'from fastapi import Depends, HTTPException, Query',
              ),
              (
                  'def list_assets_view(conn, q: str, condition: str, status: str, site_id, sort: str):',
                  'def list_assets_view(conn, q: str, condition: str, status: str, site_id, sort: str, limit: int, offset: int):',
              ),
              (
                  "    sql += f' ORDER BY {order}'\n    return _rows(conn.execute(sql, args))",
                  "    sql += f' ORDER BY {order}, a.id LIMIT ? OFFSET ?'\n    args += [limit, offset]\n    return _rows(conn.execute(sql, args))",
              ),
              (
                  "        sort: str = 'asset_no',\n        user=Depends(current_user),",
                  "        sort: str = 'asset_no',\n        limit: int = Query(200, ge=1, le=1000),\n        offset: int = Query(0, ge=0),\n        user=Depends(current_user),",
              ),
              (
                  '            return list_assets_view(conn, q, condition, status, site_id, sort)',
                  '            return list_assets_view(conn, q, condition, status, site_id, sort, limit, offset)',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate deterministic evidence
        run: python scripts/engineering_evidence.py --write ENGINEERING_EVIDENCE.json
      - name: Compile backend
        run: python -m compileall -q app scripts
      - name: Run focused pagination regressions
        run: python -m pytest -q tests/test_asset_pagination.py tests/test_authorization_contract.py
      - name: Verify deterministic evidence
        run: python scripts/engineering_evidence.py --check ENGINEERING_EVIDENCE.json
      - name: Commit validated patch and remove one-shot workflow
        run: |
          rm .github/workflows/asset-pagination-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/asset_store.py tests/test_asset_pagination.py ENGINEERING_EVIDENCE.json .github/workflows/asset-pagination-one-shot.yml
          git commit -m 'feat(api): add bounded asset registry pagination'
          git push origin HEAD:oxalpha/euas-asset-pagination
