name: EUAS Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euas-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit installed Python environment
        run: python -m pip_audit --local

  container-scan:
    name: Container build, smoke and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate hardened Compose profiles
        shell: bash
        env:
          EUAS_POSTGRES_PASSWORD: compose-ci-postgres-secret
          EUAS_BOOTSTRAP_ADMIN_PASSWORD: "Compose-ci-bootstrap-admin-2026!"
          EUAS_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/tmp/euas-compose-sqlite.yml
          docker compose -f docker-compose.postgres.yml config >/tmp/euas-compose-postgres.yml
          python - <<'PY'
          from pathlib import Path
          for path in ('docker-compose.yml', 'docker-compose.postgres.yml'):
              text = Path(path).read_text(encoding='utf-8')
              service = text.split('\n  euas:\n', 1)[1]
              assert '    cap_drop:\n      - ALL\n' in service, path
              assert '    security_opt:\n      - no-new-privileges:true\n' in service, path
          print('PASS hardened EUAS Compose runtime contract')
          PY

      - name: Build EUAS image
        run: docker build --pull --tag euas-security:${{ github.sha }} .

      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name euas-security-smoke --cap-drop ALL --security-opt no-new-privileges:true --publish 8879:8000 euas-security:${{ github.sha }}
          cleanup() { docker logs euas-security-smoke || true; docker rm --force euas-security-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker inspect euas-security-smoke --format '{{json .HostConfig.CapDrop}}' | grep -q '"ALL"'
          docker inspect euas-security-smoke --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges:true'
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8879/api/health >/tmp/euas-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "EUAS container did not become healthy" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/euas-health.json').read_text())
          assert payload['status'] == 'ok', payload
          assert payload['database_backend'] == 'sqlite', payload
          print(json.dumps(payload, sort_keys=True))
          PY
          rejected_status=$(curl --silent --output /tmp/euas-untrusted-host.txt --dump-header /tmp/euas-untrusted-host.headers --write-out '%{http_code}' --header 'Host: attacker.invalid' http://127.0.0.1:8879/api/health)
          if [ "$rejected_status" != "400" ]; then
            echo "Untrusted Host was not rejected: HTTP $rejected_status" >&2
            cat /tmp/euas-untrusted-host.txt >&2 || true
            exit 1
          fi
          grep -qi '^x-content-type-options: nosniff' /tmp/euas-untrusted-host.headers
          grep -qi '^x-frame-options: DENY' /tmp/euas-untrusted-host.headers
          grep -qi '^content-security-policy:' /tmp/euas-untrusted-host.headers

          # Prove a file that physically exists in UPLOAD_DIR cannot bypass the
          # authenticated document-download API through the legacy static mount.
          docker exec euas-security-smoke sh -c "printf 'EUAS_PRIVATE_UPLOAD_PROBE' > /app/uploads/security-boundary-probe.txt"
          upload_status=$(curl --silent --output /tmp/euas-upload-probe.txt --dump-header /tmp/euas-upload-probe.headers --write-out '%{http_code}' http://127.0.0.1:8879/uploads/security-boundary-probe.txt)
          if [ "$upload_status" != "404" ]; then
            echo "Private upload was exposed through /uploads: HTTP $upload_status" >&2
            cat /tmp/euas-upload-probe.txt >&2 || true
            exit 1
          fi
          if grep -q 'EUAS_PRIVATE_UPLOAD_PROBE' /tmp/euas-upload-probe.txt; then
            echo "Private upload contents leaked through /uploads" >&2
            exit 1
          fi
          grep -qi '^cache-control: no-store, private, max-age=0' /tmp/euas-upload-probe.headers
          grep -qi '^content-security-policy:' /tmp/euas-upload-probe.headers

          python scripts/http_ui_smoke.py http://127.0.0.1:8879

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "euas-security:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
