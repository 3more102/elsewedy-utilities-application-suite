name: EUAS Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euas-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Audit installed Python environment
        run: python -m pip_audit --local

  container-scan:
    name: Container build, smoke and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build EUAS image
        run: docker build --pull --tag euas-security:${{ github.sha }} .

      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name euas-security-smoke --publish 8879:8000 euas-security:${{ github.sha }}
          cleanup() { docker logs euas-security-smoke || true; docker rm --force euas-security-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8879/api/health >/tmp/euas-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "EUAS container did not become healthy" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/euas-health.json').read_text())
          assert payload['status'] == 'ok', payload
          assert payload['database_backend'] == 'sqlite', payload
          print(json.dumps(payload, sort_keys=True))
          PY
          python scripts/http_ui_smoke.py http://127.0.0.1:8879

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "euas-security:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
