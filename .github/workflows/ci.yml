name: EUAS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-static:
    name: Frontend static validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/ux-enhancements.js
          node --check static/dashboard-enhancements.js
          node --check static/productivity-enhancements.js
          node --check static/operational-enhancements.js
          node --check static/workspace-preferences.js
          node --check static/command-palette.js
          node --check static/sw.js

      - name: Validate web manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('static/manifest.webmanifest', 'utf8'))"

  sqlite-regression:
    name: SQLite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require warning-free FastAPI TestClient import
        run: python -W error -c "from fastapi.testclient import TestClient; print(TestClient.__module__)"

      - name: Compile backend
        run: python -m compileall -q app scripts

      - name: Validate SQLite migration operations
        env:
          EUAS_DB_PATH: /tmp/euas_migration_ci.db
          EUAS_VERSION: 3.9.0
        run: |
          python scripts/migrate.py upgrade
          python scripts/migrate.py check

      - name: Verify deterministic engineering evidence
        run: python scripts/engineering_evidence.py --check ENGINEERING_EVIDENCE.json

      - name: Run readiness policy tests
        run: pytest -q tests/test_production_readiness.py tests/test_database_adapter.py

      - name: Run full SQLite regression suite
        env:
          EUAS_DB_PATH: /tmp/euas_ci.db
          EUAS_VERSION: 3.9.0
        run: pytest -q

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: euas
          POSTGRES_PASSWORD: euas_ci_secret
          POSTGRES_DB: euas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euas -d euas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EUAS_ENV: production
      EUAS_DATABASE_URL: postgresql://euas:euas_ci_secret@127.0.0.1:5432/euas
      EUAS_BOOTSTRAP_ADMIN_PASSWORD: "CI-only-bootstrap-admin-2026!"
      EUAS_AUTOMATION_INTERVAL_MINUTES: "5"
      EUAS_SESSION_HOURS: "8"
      EUAS_MAX_UPLOAD_MB: "25"
      EUAS_VERSION: 3.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app scripts

      - name: Verify PostgreSQL connectivity
        run: python scripts/postgres_preflight.py

      - name: Run strict production readiness gate
        run: python scripts/production_readiness.py --strict-production --require-postgres --check-db

      - name: Verify PostgreSQL migration contract
        run: python scripts/migrate.py check

      - name: Run PostgreSQL inventory concurrency smoke
        run: python scripts/inventory_concurrency_smoke.py

      - name: Run PostgreSQL audit concurrency smoke
        run: python scripts/audit_concurrency_smoke.py

      - name: Run PostgreSQL procurement concurrency smoke
        run: python scripts/procurement_concurrency_smoke.py

      - name: Run PostgreSQL reservation concurrency smoke
        run: python scripts/reservation_concurrency_smoke.py

      - name: Run PostgreSQL workflow concurrency smoke
        run: python scripts/workflow_concurrency_smoke.py

      - name: Run PostgreSQL dispatch/work-state concurrency smoke
        run: python scripts/dispatch_work_state_concurrency_smoke.py

      - name: Run PostgreSQL dispatch assignment concurrency smoke
        run: python scripts/dispatch_assignment_concurrency_smoke.py

      - name: Run PostgreSQL dispatch redispatch concurrency smoke
        run: python scripts/dispatch_redispatch_concurrency_smoke.py

      - name: Run PostgreSQL inventory transfer concurrency smoke
        run: python scripts/inventory_transfer_concurrency_smoke.py

      - name: Run PostgreSQL PM generation concurrency smoke
        run: python scripts/pm_generation_concurrency_smoke.py

      - name: Run PostgreSQL alarm work-order concurrency smoke
        run: python scripts/alarm_work_order_concurrency_smoke.py

      - name: Run PostgreSQL inspection submission concurrency smoke
        run: python scripts/inspection_submission_concurrency_smoke.py

      - name: Run PostgreSQL alarm lifecycle concurrency smoke
        run: python scripts/alarm_lifecycle_concurrency_smoke.py

      - name: Run PostgreSQL business-number concurrency smoke
        run: python scripts/business_number_concurrency_smoke.py

      - name: Run PostgreSQL reorder generation concurrency smoke
        run: python scripts/reorder_generation_concurrency_smoke.py

      - name: Run PostgreSQL outbox delivery concurrency smoke
        run: python scripts/outbox_delivery_concurrency_smoke.py

      - name: Run PostgreSQL scheduler singleton concurrency smoke
        run: python scripts/scheduler_singleton_concurrency_smoke.py

      - name: Run PostgreSQL telemetry temporal-ordering concurrency smoke
        run: python scripts/telemetry_temporal_ordering_concurrency_smoke.py

      - name: Run PostgreSQL telemetry temporal integrity concurrency smoke
        run: python scripts/telemetry_temporal_integrity_concurrency_smoke.py

      - name: Run live PostgreSQL HTTP smoke
        run: python scripts/postgres_smoke_test.py
