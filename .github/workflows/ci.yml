name: EUAS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-regression:
    name: SQLite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app scripts

      - name: Run readiness policy tests
        run: pytest -q tests/test_production_readiness.py tests/test_database_adapter.py

      - name: Run full SQLite regression suite
        env:
          EUAS_DB_PATH: /tmp/euas_ci.db
          EUAS_VERSION: 3.9.0
        run: pytest -q

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: euas
          POSTGRES_PASSWORD: euas_ci_secret
          POSTGRES_DB: euas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euas -d euas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EUAS_ENV: production
      EUAS_DATABASE_URL: postgresql://euas:euas_ci_secret@127.0.0.1:5432/euas
      EUAS_AUTOMATION_INTERVAL_MINUTES: "5"
      EUAS_SESSION_HOURS: "8"
      EUAS_MAX_UPLOAD_MB: "25"
      EUAS_VERSION: 3.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app scripts

      - name: Verify PostgreSQL connectivity
        run: python scripts/postgres_preflight.py

      - name: Run strict production readiness gate
        run: python scripts/production_readiness.py --strict-production --require-postgres --check-db

      - name: Run live PostgreSQL HTTP smoke
        run: python scripts/postgres_smoke_test.py
