name: Refactor fixed inline styles

on:
  push:
    branches:
      - oxalpha/euas-fixed-inline-style-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, 'trigger fixed inline style refactor')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: oxalpha/euas-fixed-inline-style-refactor
          fetch-depth: 0

      - name: Move fixed inline styles to stylesheet selectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('static/app.js')
          css_path = Path('static/styles.css')
          app = app_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          replacements = {
              'style="margin-top:14px"': 'data-csp-style="mt14"',
              'style="margin-top:12px"': 'data-csp-style="mt12"',
              'style="margin-top:15px"': 'data-csp-style="mt15"',
              'style="grid-template-columns:1fr 1fr"': 'data-csp-style="grid2"',
              'style="display:flex;gap:8px;align-items:center;font-size:11px;margin-top:10px"': 'data-csp-style="inline-check"',
          }
          counts = {}
          for old, new in replacements.items():
              count = app.count(old)
              if count < 1:
                  raise SystemExit(f'expected fixed inline style not found: {old}')
              counts[old] = count
              app = app.replace(old, new)

          for old in replacements:
              if old in app:
                  raise SystemExit(f'fixed inline style remains after replacement: {old}')

          marker = '/* CSP fixed inline-style migration */'
          if marker in css:
              raise SystemExit('CSP fixed inline-style stylesheet marker already exists')
          css += '''\n\n/* CSP fixed inline-style migration */\n[data-csp-style="mt14"]{margin-top:14px}\n[data-csp-style="mt12"]{margin-top:12px}\n[data-csp-style="mt15"]{margin-top:15px}\n[data-csp-style="grid2"]{grid-template-columns:1fr 1fr}\n[data-csp-style="inline-check"]{display:flex;gap:8px;align-items:center;font-size:11px;margin-top:10px}\n'''

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

          style_attribute = re.compile(r'\\bstyle\\s*=\\s*["\\\']([^"\\\']*)["\\\']', re.IGNORECASE)
          remaining = style_attribute.findall(app)
          print('fixed replacements:', counts)
          print('remaining app.js inline style attributes:', len(remaining))
          print('remaining values:', sorted(set(remaining)))
          PY
          node --check static/app.js

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/styles.css
          git commit -m 'refactor(ui): move fixed inline styles to CSS'
          git push origin HEAD:oxalpha/euas-fixed-inline-style-refactor
