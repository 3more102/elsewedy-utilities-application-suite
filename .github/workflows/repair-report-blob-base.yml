name: Repair report blob base

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'oxalpha/euas-zero-inline-style-csp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: oxalpha/euas-zero-inline-style-csp
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repair protected report blob base handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('static/app.js')
          test_path = Path('tests/test_ui_shell.py')
          app = app_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          old_open = "async function openProtected(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+S.token}});if(!r.ok)throw new Error('Unable to open report');const b=await r.blob(),u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}"
          new_open = "async function openProtected(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+S.token}});if(!r.ok)throw new Error('Unable to open report');const ct=(r.headers.get('content-type')||'text/html').split(';')[0],text=await r.text(),base=`<base href=\"${esc(location.origin+'/')}\">`,html=text.replace(/<head(\\s[^>]*)?>/i,m=>m+base);if(html===text)throw new Error('Report HTML is missing a head element');const b=new Blob([html],{type:ct}),u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}"
          if app.count(old_open) != 1:
              raise SystemExit(f'expected one legacy openProtected implementation, found {app.count(old_open)}')
          app = app.replace(old_open, new_open, 1)

          old_report = "$('#wo-report').onclick=async()=>{try{const r=await fetch(`/api/work-orders/${id}/report`,{headers:{Authorization:'Bearer '+S.token}});if(!r.ok)throw new Error('Report failed');const b=await r.blob(),u=URL.createObjectURL(b);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){toast(e.message)}}"
          new_report = "$('#wo-report').onclick=async()=>{try{await openProtected(`/api/work-orders/${id}/report`)}catch(e){toast(e.message)}}"
          if app.count(old_report) != 1:
              raise SystemExit(f'expected one duplicated work-report blob handler, found {app.count(old_report)}')
          app = app.replace(old_report, new_report, 1)

          anchor = "    assert \"appropriately provisioned technician account\" in app_js\n"
          extra = """    assert \"text=await r.text()\" in app_js\n    assert \"location.origin+'/'\" in app_js\n    assert '<base href=' in app_js\n    assert 'new Blob([html],{type:ct})' in app_js\n    assert \"await openProtected(`/api/work-orders/${id}/report`)\" in app_js\n    assert \"throw new Error('Report HTML is missing a head element')\" in app_js\n    assert \"const b=await r.blob(),u=URL.createObjectURL(b)\" not in app_js\n"""
          if anchor not in tests:
              raise SystemExit('UI shell regression insertion point not found')
          tests = tests.replace(anchor, anchor + extra, 1)

          app_path.write_text(app, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY
          node --check static/app.js
          python -m pytest -q tests/test_ui_shell.py tests/test_production_csp.py tests/test_inline_style_debt.py

      - name: Commit report blob repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js tests/test_ui_shell.py
          git diff --cached --quiet && { echo 'report blob repair produced no changes' >&2; exit 1; }
          git commit -m 'fix(ui): preserve report styles in blob documents'
          git push origin HEAD:oxalpha/euas-zero-inline-style-csp
