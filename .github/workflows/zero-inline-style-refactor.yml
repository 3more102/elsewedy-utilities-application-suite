name: Eliminate inline style CSP debt

on:
  push:
    branches:
      - oxalpha/euas-zero-inline-style-csp

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, 'trigger zero inline style refactor')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: oxalpha/euas-zero-inline-style-csp
          fetch-depth: 0

      - name: Replace dynamic inline styles with geometry and external CSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('static/app.js')
          css_path = Path('static/styles.css')
          application_path = Path('app/application.py')
          production_path = Path('app/production.py')
          csp_test_path = Path('tests/test_production_csp.py')
          debt_test_path = Path('tests/test_inline_style_debt.py')
          smoke_path = Path('scripts/http_ui_smoke.py')

          app = app_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          application = application_path.read_text(encoding='utf-8')
          production = production_path.read_text(encoding='utf-8')
          csp_test = csp_test_path.read_text(encoding='utf-8')
          debt_test = debt_test_path.read_text(encoding='utf-8')
          smoke = smoke_path.read_text(encoding='utf-8')

          old_bar = '''function barChart(items,labelKey,valueKey){const max=Math.max(1,...items.map(x=>Number(x[valueKey]||0)));return `<div class="chart-bars">${items.map(x=>`<div class="bar-row" title="${esc(x[labelKey])}: ${fmt(x[valueKey])}"><span>${esc(x[labelKey])}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,Number(x[valueKey]||0)/max*100)}%"></div></div><b>${fmt(x[valueKey])}</b></div>`).join('')}</div>`}'''
          new_bar = '''function barChart(items,labelKey,valueKey){
  const max=Math.max(1,...items.map(x=>Number(x[valueKey]||0)));
  return `<div class="chart-bars">${items.map(x=>{const width=Math.max(4,Number(x[valueKey]||0)/max*100);return `<div class="bar-row" title="${esc(x[labelKey])}: ${fmt(x[valueKey])}"><span>${esc(x[labelKey])}</span><svg class="bar-svg" viewBox="0 0 100 9" preserveAspectRatio="none" aria-hidden="true"><rect class="bar-bg" x="0" y="0" width="100" height="9" rx="4.5"></rect><rect class="bar-fg" x="0" y="0" width="${width}" height="9" rx="4.5"></rect></svg><b>${fmt(x[valueKey])}</b></div>`}).join('')}</div>`
}
function donutPoint(percent,radius){const angle=(Number(percent)*3.6-90)*Math.PI/180;return [69+radius*Math.cos(angle),69+radius*Math.sin(angle)]}
function donutSlice(start,end,cls){
  const s=Math.max(0,Math.min(100,Number(start)||0)),e=Math.max(s,Math.min(100,Number(end)||0)),span=e-s;
  if(span<=0.0001)return '';
  if(span>=99.999)return `<circle class="donut-ring ${cls}" cx="69" cy="69" r="57.5"></circle>`;
  const outer=69,inner=46,[ox1,oy1]=donutPoint(s,outer),[ox2,oy2]=donutPoint(e,outer),[ix2,iy2]=donutPoint(e,inner),[ix1,iy1]=donutPoint(s,inner),large=span>50?1:0,n=v=>Number(v).toFixed(3);
  return `<path class="donut-slice ${cls}" d="M ${n(ox1)} ${n(oy1)} A ${outer} ${outer} 0 ${large} 1 ${n(ox2)} ${n(oy2)} L ${n(ix2)} ${n(iy2)} A ${inner} ${inner} 0 ${large} 0 ${n(ix1)} ${n(iy1)} Z"></path>`
}
function donutChart(good,fair){
  const g=Math.max(0,Math.min(100,Number(good)||0)),f=Math.max(0,Math.min(100-g,Number(fair)||0));
  return `<div class="donut"><svg class="donut-svg" viewBox="0 0 138 138" role="img" aria-label="Asset health: ${Math.round(g)} percent good, ${Math.round(f)} percent fair or warning">${donutSlice(0,g,'good')}${donutSlice(g,g+f,'fair')}${donutSlice(g+f,100,'bad')}</svg><div class="donut-center"><strong>${Math.round(g)}%</strong><span>Good</span></div></div>`
}'''
          if app.count(old_bar) != 1:
              raise SystemExit(f'expected one legacy barChart, found {app.count(old_bar)}')
          app = app.replace(old_bar, new_bar, 1)

          old_donut = '''<div class="panel-body"><div class="donut-wrap"><div class="donut" style="background:conic-gradient(var(--green) 0 ${good}%,var(--amber) ${good}% ${good+fair}%,var(--red) ${good+fair}% 100%)"><div class="donut-center"><strong>${Math.round(good)}%</strong><span>Good</span></div></div><div class="legend">'''
          new_donut = '''<div class="panel-body"><div class="donut-wrap">${donutChart(good,fair)}<div class="legend">'''
          if app.count(old_donut) != 1:
              raise SystemExit(f'expected one legacy donut, found {app.count(old_donut)}')
          app = app.replace(old_donut, new_donut, 1)

          map_pattern = re.compile(r"async function renderMap\(\)\{.*?\nfunction showMapSite", re.DOTALL)
          new_map = '''async function renderMap(){const sites=await api('/api/map');S.cache.map=sites;const lats=sites.map(x=>x.latitude),lons=sites.map(x=>x.longitude),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);const pos=s=>({x:10+(s.longitude-minLon)/Math.max(maxLon-minLon,.01)*80,y:10+(maxLat-s.latitude)/Math.max(maxLat-minLat,.01)*80});$('#content').innerHTML=`<div class="hero"><div><h1>GIS / Location Management</h1><p>Region → City → Site → Building → Floor → Room → Asset.</p></div></div><div class="map-layout"><div class="geo-map"><svg class="geo-map-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Operational site map">${sites.map(s=>{const p=pos(s);return `<g class="map-pin" data-site="${s.id}" transform="translate(${p.x} ${p.y})" tabindex="0" role="button" aria-label="${esc(s.site_code)} — ${s.assets} assets"><circle class="pin-dot-svg" r="2.2"></circle><text class="pin-label-svg" y="5">${esc(s.site_code)} · ${s.assets} assets</text></g>`}).join('')}</svg></div><aside class="map-side" id="map-side">${empty('Select a site pin to inspect assets, work and field coverage.')}</aside></div>`;$$('.map-pin').forEach(p=>{const open=()=>showMapSite(Number(p.dataset.site));p.onclick=open;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
function showMapSite'''
          app, count = map_pattern.subn(new_map, app, count=1)
          if count != 1:
              raise SystemExit(f'expected one legacy renderMap, found {count}')

          old_progress = '''<div class="progress"><span style="width:${p.progress}%"></span></div>'''
          new_progress = '''<progress class="project-progress" max="100" value="${Math.max(0,Math.min(100,Number(p.progress)||0))}">${fmt(p.progress)}%</progress>'''
          if app.count(old_progress) != 1:
              raise SystemExit(f'expected one legacy project progress style, found {app.count(old_progress)}')
          app = app.replace(old_progress, new_progress, 1)

          old_bar_css = '.bar-track{height:9px;border-radius:5px;background:#edf0f3;overflow:hidden}.bar-fill{height:100%;background:var(--red);border-radius:5px}'
          new_bar_css = '.bar-svg{width:100%;height:9px;display:block;overflow:hidden;border-radius:5px}.bar-bg{fill:#edf0f3}.bar-fg{fill:var(--red)}'
          if css.count(old_bar_css) != 1:
              raise SystemExit('legacy bar CSS contract not found exactly once')
          css = css.replace(old_bar_css, new_bar_css, 1)

          old_donut_css = '.donut{width:138px;height:138px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 65%,var(--amber) 65% 85%,var(--red) 85% 100%)}'
          new_donut_css = '.donut{width:138px;height:138px;border-radius:50%;display:grid;place-items:center;position:relative}.donut-svg{width:100%;height:100%;display:block}.donut-slice.good{fill:var(--green)}.donut-slice.fair{fill:var(--amber)}.donut-slice.bad{fill:var(--red)}.donut-ring{fill:none;stroke-width:23}.donut-ring.good{stroke:var(--green)}.donut-ring.fair{stroke:var(--amber)}.donut-ring.bad{stroke:var(--red)}'
          if css.count(old_donut_css) != 1:
              raise SystemExit('legacy donut CSS contract not found exactly once')
          css = css.replace(old_donut_css, new_donut_css, 1)
          old_center_css = '.donut-center{width:92px;height:92px;background:white;border-radius:50%;display:grid;place-items:center;text-align:center}'
          new_center_css = '.donut-center{width:92px;height:92px;background:white;border-radius:50%;display:grid;place-items:center;text-align:center;position:absolute;inset:23px}'
          if css.count(old_center_css) != 1:
              raise SystemExit('legacy donut center CSS contract not found exactly once')
          css = css.replace(old_center_css, new_center_css, 1)

          old_map_css = '.map-pin{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;text-align:center;z-index:2}.pin-dot{width:24px;height:24px;border:4px solid white;border-radius:50%;background:var(--red);box-shadow:0 3px 10px rgba(0,0,0,.25);margin:auto}.pin-label{margin-top:4px;background:rgba(255,255,255,.94);border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.1)}'
          new_map_css = '.geo-map-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.map-pin{cursor:pointer;outline:none;pointer-events:all}.pin-dot-svg{fill:var(--red);stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke}.pin-label-svg{fill:var(--ink);font-size:2px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:rgba(255,255,255,.96);stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke}.map-pin:focus .pin-dot-svg{stroke:var(--ink);stroke-width:1.2}'
          if css.count(old_map_css) != 1:
              raise SystemExit('legacy absolute map pin CSS contract not found exactly once')
          css = css.replace(old_map_css, new_map_css, 1)

          progress_css = '.project-progress{width:100%;height:7px;appearance:none;border:0;border-radius:4px;overflow:hidden;background:#edf0f3;margin-top:8px}.project-progress::-webkit-progress-bar{background:#edf0f3;border-radius:4px}.project-progress::-webkit-progress-value{background:var(--red);border-radius:4px}.project-progress::-moz-progress-bar{background:var(--red);border-radius:4px}'
          if '.project-progress{' in css:
              raise SystemExit('project progress CSS already exists')
          css += '\n' + progress_css + '\n'

          snapshot_style = '''<style>body{{font-family:Arial;margin:40px;color:#172033}}h1{{color:#c9272c}}table{{border-collapse:collapse;width:100%;margin:12px 0}}td,th{{border:1px solid #ddd;padding:8px;text-align:left}}small{{color:#666}}</style></head><body>'''
          work_style = '''<style>body{{font-family:Arial;margin:40px;color:#172033}}h1{{color:#c9272c}}table{{border-collapse:collapse;width:100%}}td,th{{border:1px solid #ddd;padding:8px;text-align:left}}small{{color:#666}}</style></head><body>'''
          if application.count(snapshot_style) != 1 or application.count(work_style) != 1:
              raise SystemExit('expected report inline style blocks were not found exactly once')
          application = application.replace(snapshot_style, '<link rel="stylesheet" href="/static/report.css"></head><body class="report snapshot-report">', 1)
          application = application.replace(work_style, '<link rel="stylesheet" href="/static/report.css"></head><body class="report work-report">', 1)

          old_style_csp = '    "style-src \'self\' \'unsafe-inline\'; "\n'
          new_style_csp = '    "style-src \'self\'; "\n    "style-src-attr \'none\'; "\n'
          if production.count(old_style_csp) != 1:
              raise SystemExit('production inline-style CSP allowance not found exactly once')
          production = production.replace(old_style_csp, new_style_csp, 1)

          csp_test = csp_test.replace(
              '    assert "style-src \'self\' \'unsafe-inline\'" in csp\n',
              '    assert "style-src \'self\'" in csp\n    assert "style-src \'self\' \'unsafe-inline\'" not in csp\n    assert "style-src-attr \'none\'" in csp\n    assert "\'unsafe-inline\'" not in csp\n',
              1,
          )
          entrypoint_anchor = "    assert not re.search(r'\\son[a-z]+\\s*=', html, flags=re.I)\n"
          entrypoint_extra = '''    application_source = (ROOT / 'app' / 'application.py').read_text(encoding='utf-8')\n    report_css = (ROOT / 'static' / 'report.css').read_text(encoding='utf-8')\n    assert application_source.count('/static/report.css') == 2\n    assert '<style' not in application_source.casefold()\n    assert '.report{' in report_css\n'''
          if entrypoint_anchor not in csp_test:
              raise SystemExit('production CSP test insertion point not found')
          csp_test = csp_test.replace(entrypoint_anchor, entrypoint_anchor + entrypoint_extra, 1)

          debt_test = debt_test.replace(
              "# Fixed legacy values have been migrated to stylesheet-backed data hooks. The\n# remaining CSP debt is dynamic rendering only: charts, GIS coordinates and\n# progress widths that require dedicated renderer refactors before production can\n# safely drop style-src 'unsafe-inline'.\nALLOWED_STATIC_STYLES: set[str] = set()\n\n\ndef _allowed_app_style(value: str) -> bool:\n    if value in ALLOWED_STATIC_STYLES:\n        return True\n    if re.fullmatch(r'width:\\\$\\\{.+\\\}%', value):\n        return True\n    if value.startswith('background:conic-gradient(') and value.endswith(')'):\n        return True\n    if re.fullmatch(r'left:\\\$\\\{p\\\.x\\\}%;top:\\\$\\\{p\\\.y\\\}%', value):\n        return True\n    return False\n",
              "# All browser-shell style attributes are forbidden. Dynamic chart, GIS and\n# progress presentation now uses HTML/SVG geometry plus external stylesheets.\n",
              1,
          )
          debt_test = debt_test.replace(
              "        unexpected.extend((path.name, value) for value in styles if not _allowed_app_style(value))\n\n    assert not unexpected, unexpected\n    # PR #101 removed 22 fixed source attributes from the measured baseline of\n    # 26. Only four dynamic source attributes remain; freeze that reduced debt.\n    assert total <= 4, f'inline style debt grew to {total} app.js attributes'\n",
              "        unexpected.extend((path.name, value) for value in styles)\n\n    assert not unexpected, unexpected\n    assert total == 0, f'inline style debt returned with {total} app.js attributes'\n",
              1,
          )
          debt_anchor = "    for hook, declaration in fixed_style_hooks.items():\n        assert f'data-csp-style=\"{hook}\"' in app_source\n        assert f'[data-csp-style=\"{hook}\"]{{{declaration}}}' in styles_css\n\n"
          debt_extra = '''    assert 'style="width:${' not in app_source\n    assert 'background:conic-gradient(' not in app_source\n    assert 'style="left:${' not in app_source\n    assert '<progress class="project-progress"' in app_source\n    assert '<svg class="bar-svg"' in app_source\n    assert '<svg class="donut-svg"' in app_source\n    assert '<svg class="geo-map-svg"' in app_source\n\n'''
          if debt_anchor not in debt_test:
              raise SystemExit('inline-style test insertion point not found')
          debt_test = debt_test.replace(debt_anchor, debt_anchor + debt_extra, 1)

          smoke_anchor = '    assert "frame-ancestors \'none\'" in csp, csp\n'
          smoke_extra = '''    assert "style-src 'self'" in csp, csp\n    assert "style-src-attr 'none'" in csp, csp\n    assert "'unsafe-inline'" not in csp, csp\n'''
          if smoke_anchor not in smoke:
              raise SystemExit('HTTP smoke CSP insertion point not found')
          smoke = smoke.replace(smoke_anchor, smoke_anchor + smoke_extra, 1)

          report_css = '''.report{font-family:Arial,sans-serif;margin:40px;color:#172033}\n.report h1{color:#c9272c}\n.report table{border-collapse:collapse;width:100%}\n.snapshot-report table{margin:12px 0}\n.report td,.report th{border:1px solid #ddd;padding:8px;text-align:left}\n.report small{color:#666}\n'''

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          application_path.write_text(application, encoding='utf-8')
          production_path.write_text(production, encoding='utf-8')
          csp_test_path.write_text(csp_test, encoding='utf-8')
          debt_test_path.write_text(debt_test, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')
          Path('static/report.css').write_text(report_css, encoding='utf-8')

          style_attribute = re.compile(r'(?<![\\w.-])style\\s*=\\s*["\\\']([^"\\\']*)["\\\']', re.IGNORECASE)
          static_offenders = []
          for path in sorted(Path('static').glob('*.js')):
              values = style_attribute.findall(path.read_text(encoding='utf-8'))
              if values:
                  static_offenders.append((str(path), values))
          if static_offenders:
              raise SystemExit(f'static inline styles remain: {static_offenders}')
          if '<style' in application.casefold():
              raise SystemExit('server-generated inline style block remains')
          if "'unsafe-inline'" in production:
              raise SystemExit('production CSP still permits unsafe-inline')
          PY

          node --check static/app.js
          python -m compileall -q app scripts tests
          pytest -q tests/test_inline_style_debt.py tests/test_production_csp.py

      - name: Commit zero-inline-style hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/application.py app/production.py scripts/http_ui_smoke.py static/app.js static/styles.css static/report.css tests/test_inline_style_debt.py tests/test_production_csp.py
          git commit -m 'feat(csp): eliminate production inline styles'
          git push origin HEAD:oxalpha/euas-zero-inline-style-csp
