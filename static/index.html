<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b6242a"><title>EUAS — Elsewedy Utilities Application Suite</title>
<link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="login" class="login-screen">
  <section class="login-card">
    <div class="login-brand"><div class="logo-mark">E</div><div><div class="eyebrow">ELSEWEDY UTILITIES</div><h1>Application Suite</h1></div></div>
    <p class="tagline">One Platform. Every Asset. Every Operation.</p>
    <form id="login-form" class="login-form">
      <label>Username<input name="username" value="omar" autocomplete="username"></label>
      <label>Password<input name="password" type="password" value="EUAS@2026" autocomplete="current-password"></label>
      <button class="btn primary large">Sign in</button><div id="login-error" class="form-error"></div>
    </form>
    <div class="login-demo">Management demo: <b>omar</b> / <b>EUAS@2026</b><br>Technician demo: <b>tech1</b> / <b>Tech@2026</b></div>
    <footer>Developed by <b>Omar &amp; Seif</b></footer>
  </section>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><div class="logo-mark small">E</div><div><div class="eyebrow">ELSEWEDY UTILITIES</div><strong>EUAS</strong></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="avatar" class="avatar">OI</div><div class="user-mini"><strong id="user-name"></strong><span id="user-role"></span></div><button id="logout-btn" class="icon-btn" title="Logout">↪</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="crumb"><button id="mobile-menu" class="icon-btn mobile-only">☰</button><div><div id="breadcrumb" class="eyebrow dark">EUAS / HOME</div><h2 id="page-title">Home</h2></div></div>
      <div class="top-actions">
        <div class="search-wrap"><input id="global-search" placeholder="Search assets, work orders, documents…"><div id="search-results" class="search-results hidden"></div></div>
        <select id="site-selector" title="Site"><option value="">All Sites</option></select>
        <button id="help-btn" class="icon-btn" title="Help">?</button>
        <button id="notification-btn" class="icon-btn notif-btn" title="Notifications">🔔<span id="notif-count" class="notif-count hidden"></span></button>
        <button id="profile-btn" class="profile-chip"><span id="profile-initial">O</span><span id="profile-name">Omar</span></button>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>

<div id="modal-layer" class="modal-layer hidden"><section class="modal"><header><div><div class="eyebrow dark">EUAS</div><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-btn">×</button></header><div id="modal-body" class="modal-body"></div></section></div>
<div id="drawer" class="drawer hidden"><header><div><div class="eyebrow dark">NOTIFICATIONS</div><h3>Notification Centre</h3></div><button id="drawer-close" class="icon-btn">×</button></header><div id="drawer-body"></div></div>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
