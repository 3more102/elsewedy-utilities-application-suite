<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b6242a"><title>EUAS — Elsewedy Utilities Application Suite</title>
<link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/ui-refresh.css"><link rel="stylesheet" href="/static/ux-enhancements.css"><link rel="stylesheet" href="/static/productivity-enhancements.css"><link rel="stylesheet" href="/static/operational-enhancements.css"><link rel="stylesheet" href="/static/workspace-preferences.css"><link rel="stylesheet" href="/static/command-palette.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to main content</a>
<div id="login" class="login-screen">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand"><div class="logo-mark" aria-hidden="true">E</div><div><div class="eyebrow">ELSEWEDY UTILITIES</div><h1 id="login-title">Application Suite</h1></div></div>
    <p class="tagline">One Platform. Every Asset. Every Operation.</p>
    <form id="login-form" class="login-form">
      <label>Username<input name="username" value="omar" autocomplete="username"></label>
      <label>Password<input name="password" type="password" value="EUAS@2026" autocomplete="current-password"></label>
      <button class="btn primary large">Sign in</button><div id="login-error" class="form-error" role="alert" aria-live="polite"></div>
    </form>
    <div class="login-demo">Management demo: <b>omar</b> / <b>EUAS@2026</b><br>Technician demo: <b>tech1</b> / <b>Tech@2026</b></div>
    <footer>Developed by <b>Omar &amp; Seif</b></footer>
  </section>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
    <div class="side-brand"><div class="logo-mark small" aria-hidden="true">E</div><div><div class="eyebrow">ELSEWEDY UTILITIES</div><strong>EUAS</strong></div></div>
    <nav id="nav" aria-label="EUAS modules"></nav>
    <div class="side-foot"><div id="avatar" class="avatar" aria-hidden="true">OI</div><div class="user-mini"><strong id="user-name"></strong><span id="user-role"></span></div><button id="logout-btn" class="icon-btn" title="Logout" aria-label="Logout">↪</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="crumb"><button id="mobile-menu" class="icon-btn mobile-only" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button><div><div id="breadcrumb" class="eyebrow dark">EUAS / HOME</div><h2 id="page-title">Home</h2></div></div>
      <div class="top-actions">
        <div class="search-wrap"><input id="global-search" aria-label="Global search" placeholder="Search assets, work orders, documents…"><div id="search-results" class="search-results hidden" role="listbox" aria-label="Search results"></div></div>
        <select id="site-selector" title="Site" aria-label="Site filter"><option value="">All Sites</option></select>
        <button id="help-btn" class="icon-btn" title="Help" aria-label="Help">?</button>
        <button id="notification-btn" class="icon-btn notif-btn" title="Notifications" aria-label="Notifications">🔔<span id="notif-count" class="notif-count hidden"></span></button>
        <button id="profile-btn" class="profile-chip" aria-label="Open profile"><span id="profile-initial" aria-hidden="true">O</span><span id="profile-name">Omar</span></button>
      </div>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>

<div id="modal-layer" class="modal-layer hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><div><div class="eyebrow dark">EUAS</div><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-btn" aria-label="Close dialog">×</button></header><div id="modal-body" class="modal-body"></div></section></div>
<aside id="drawer" class="drawer hidden" aria-label="Notification centre"><header><div><div class="eyebrow dark">NOTIFICATIONS</div><h3>Notification Centre</h3></div><button id="drawer-close" class="icon-btn" aria-label="Close notifications">×</button></header><div id="drawer-body"></div></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script><script src="/static/ux-enhancements.js"></script><script src="/static/dashboard-enhancements.js"></script><script src="/static/productivity-enhancements.js"></script><script src="/static/operational-enhancements.js"></script><script src="/static/workspace-preferences.js"></script><script src="/static/command-palette.js"></script><script src="/static/navigation-history.js"></script>
</body>
</html>
